<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Curva qualitativa corrente-tens&#227;o de um diodo</title>
  <desc id="desc">A corrente cresce lentamente para pequenas tens&#245;es e rapidamente para tens&#245;es maiores. Uma reta tangente prolongada cruza o eixo das tens&#245;es em Vb.</desc>
