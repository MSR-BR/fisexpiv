  <path d="M887 412l-13-8v16z M106 99l-8 13h16z" fill="#173a55"/>
  <path d="M128 407C305 407 432 403 512 390 C590 377 648 342 697 286 C742 233 776 163 807 102"
        fill="none" stroke="#176ca0" stroke-width="6" stroke-linecap="round"/>
  <path d="M619 412L836 101" fill="none" stroke="#d66e38" stroke-width="4"/>
  <path d="M619 412V447" fill="none" stroke="#d66e38" stroke-width="2" stroke-dasharray="6 6"/>
