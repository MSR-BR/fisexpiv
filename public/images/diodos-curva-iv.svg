  <text x="927" y="431" fill="#173a55" font-family="Georgia,serif" font-size="18">D</text>
  <text x="96" y="89" fill="#173a55" font-family="Georgia,serif" font-size="27">I</text>
  <text x="606" y="474" fill="#b25424" font-family="Georgia,serif" font-size="25" font-weight="bold">V</text>
  <text x="625" y="484" fill="#b25424" font-family="Georgia,serif" font-size="17" font-weight="bold">b</text>
